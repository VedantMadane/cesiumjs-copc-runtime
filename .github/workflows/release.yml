name: Release packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - name: Publish packages not already in the registry
        shell: bash
        run: |
          publish_if_missing() {
            local workspace="$1"
            local package_name="$2"
            local manifest="$3"
            local package_version
            package_version="$(node -p "require('./${manifest}').version")"

            if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
              echo "Skipping ${package_name}@${package_version}: already published"
              return
            fi

            npm publish --workspace "${workspace}" --provenance --access public
          }

          publish_if_missing cesiumjs-copc-core cesiumjs-copc-core packages/copc-core/package.json
          publish_if_missing cesiumjs-copc-runtime cesiumjs-copc-runtime packages/copc-runtime/package.json
          publish_if_missing cesiumjs-copc-worker cesiumjs-copc-worker packages/copc-worker/package.json
          publish_if_missing cesiumjs-copc-analysis cesiumjs-copc-analysis packages/copc-analysis/package.json
          publish_if_missing cesiumjs-copc cesiumjs-copc packages/cesium-copc/package.json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "CesiumJS COPC Runtime $GITHUB_REF_NAME"

    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
