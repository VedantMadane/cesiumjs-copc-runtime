name: Release packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - name: Publish core
        run: npm publish --workspace cesiumjs-copc-core --provenance --access public
      - name: Publish runtime
        run: npm publish --workspace cesiumjs-copc-runtime --provenance --access public
      - name: Publish worker
        run: npm publish --workspace cesiumjs-copc-worker --provenance --access public
      - name: Publish analysis
        run: npm publish --workspace cesiumjs-copc-analysis --provenance --access public
      - name: Publish Cesium integration
        run: npm publish --workspace cesiumjs-copc --provenance --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "CesiumJS COPC Runtime $GITHUB_REF_NAME"

    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
